name: Test build

# An installable dmg for trying a branch out, attached to the run as an
# artifact. Ad-hoc signed and not notarized, so macOS asks before opening it.
on:
  pull_request:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.PULLOVER_GITHUB_CLIENT_ID }}
      - run: >-
          npx electron-builder --mac dmg --universal --publish never
          -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips signing on pull requests unless told
          # otherwise, which would test a different app from the one released.
          # The identity is ad-hoc, so no secret is involved.
          CSC_FOR_PULL_REQUEST: 'true'
      # An ad-hoc signed app under the hardened runtime is killed by dyld
      # before it draws anything: library validation rejects its own
      # Electron Framework. Launching it here catches that before anyone
      # installs it.
      - name: Check the app starts
        run: |
          app=dist/mac-universal/Pullover.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Pullover" > launch.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            cat launch.log
            echo "::error::Pullover exited on launch"
            exit 1
          fi
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: Pullover-dmg
          path: dist/*.dmg
          if-no-files-found: error

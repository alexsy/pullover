name: Release

# The whole release happens in CI — locally you only push a tag:
#   git tag v0.1.1 && git push origin v0.1.1
# The `build` job builds one universal dmg (Apple Silicon + Intel), signs it
# with a Developer ID certificate, has Apple notarize it, and attaches it to
# a draft GitHub release (electron-builder's publisher, see the `publish`
# section of electron-builder.yml). The `publish` job then runs Claude, which
# writes user-facing release notes from the commit log, verifies the assets,
# and publishes the draft.
#
# Repository configuration — Settings → Secrets and variables → Actions:
#   Variables
#   - PULLOVER_GITHUB_CLIENT_ID — the client ID of the official Pullover
#     OAuth App (a Device Flow public client; the client ID is not a secret).
#     It is baked into the build so released binaries can sign in out of the box.
#   Secrets
#   - ANTHROPIC_API_KEY      — for the release-notes step.
#   - CSC_LINK               — Developer ID Application cert, .p12 as base64
#                              (`base64 -i Certificates.p12`). Export it from
#                              Keychain Access with the private key included.
#   - CSC_KEY_PASSWORD       — the password that .p12 was exported with.
#   - APPLE_API_KEY_CONTENT  — an App Store Connect API key (.p8), verbatim.
#                              Apple allows downloading it exactly once.
#   - APPLE_API_KEY_ID       — that key's ID.
#   - APPLE_API_ISSUER       — the issuer UUID it belongs to.
# Every one of these is optional in this fork:
#   - Without the five signing secrets the build is ad-hoc signed and not
#     notarized. macOS asks before opening it the first time, and it cannot
#     update itself in place, so it offers the new version as a download
#     instead (MAIN_VITE_UPDATE_MODE, read by src/main/updater.ts).
#   - Without PULLOVER_GITHUB_CLIENT_ID, GitHub sign-in is left out of the
#     build; Azure DevOps sign-in needs no client ID.
#   - Without ANTHROPIC_API_KEY the release is published with the commit
#     subjects as its notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # Pinned, not `macos-latest`. electron-builder creates its signing
    # keychain with a random password but calls `security
    # set-key-partition-list` with the *certificate's* password instead; the
    # macOS 26 image that rolled out on 2026-08-28 started rejecting that, so
    # signing fails with "SecKeychainUnlock: The user name or passphrase you
    # entered is not correct". Fixed upstream in 27.0.0-alpha.6 and not
    # backported — unpin once a stable release carries it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm test` includes the screenshot tests, which drive a real Chromium.
      # Same cache key as ci.yml, and the same runner OS, so this usually
      # restores what the CI run on this very commit already downloaded.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - run: npm run typecheck
      - run: npm test

      - name: Note a missing OAuth client ID
        if: ${{ vars.PULLOVER_GITHUB_CLIENT_ID == '' }}
        run: echo "::warning::PULLOVER_GITHUB_CLIENT_ID is not set, so this build cannot sign in with GitHub. Azure DevOps sign-in is unaffected."

      # All five or none: a partial set is a mistake worth stopping for,
      # where none at all is the deliberate unsigned release.
      - name: Decide whether to sign
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ "$missing" = " CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER" ]; then
            echo "::warning::No signing secrets: releasing an unsigned build that offers updates as downloads."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — signing needs all five. See the header of this file."
            exit 1
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.PULLOVER_GITHUB_CLIENT_ID }}
          MAIN_VITE_UPDATE_MODE: ${{ steps.signing.outputs.signed == 'true' && 'install' || 'notify' }}

      - name: Stage the App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Build the universal dmg and zip, and attach them to a draft release
        if: steps.signing.outputs.signed == 'true'
        run: npx electron-builder --mac dmg zip --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate, as base64 of the .p12.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # App Store Connect API key. Preferred over APPLE_ID +
          # APPLE_APP_SPECIFIC_PASSWORD: it is scoped, revocable, and not
          # tied to a personal Apple ID. Note electron-builder checks
          # APPLE_ID first, so those two must stay unset for this to be used.
          APPLE_API_KEY: ${{ runner.temp }}/asc-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Proves the app users end up running is really signed and notarized,
      # rather than trusting that the build step did it. The checks target the
      # .app, not the dmg: electron-builder notarizes and staples the app and
      # then packages the stapled copy into an unsigned disk image, which is
      # deliberate — `dmg.sign` defaults to false because, in its own words,
      # signing the image "will lead to unwanted errors in combination with
      # notarization requirements". The ticket travels with the app, so the
      # app is what Gatekeeper judges on first launch.
      - name: Build the unsigned universal dmg and zip, and attach them to a draft release
        if: steps.signing.outputs.signed != 'true'
        run: >-
          npx electron-builder --mac dmg zip --universal --publish always
          -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the app is signed, notarized and stapled
        if: steps.signing.outputs.signed == 'true'
        run: |
          app=$(ls -d dist/mac-universal/*.app)
          echo "Checking $app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Must report `source=Notarized Developer ID`; anything else means
          # the build produced something Gatekeeper would still block.
          spctl --assess --type execute -vv "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for the changelog

      # Claude Code CLI directly, not anthropics/claude-code-action — the
      # action refuses tag pushes ("Unsupported event type: push").
      - name: Check for a release-notes key
        id: notes
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "claude=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish the draft with the commit subjects as notes
        if: steps.notes.outputs.claude != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(git describe --tags --abbrev=0 '${{ github.ref_name }}^' 2>/dev/null || true)
          range=${previous:+$previous..}${{ github.ref_name }}
          # The same check the Claude path makes before publishing: without the
          # zip and latest-mac.yml, installed copies never see this release.
          version='${{ github.ref_name }}'; version=${version#v}
          assets=$(gh api 'repos/${{ github.repository }}/releases' --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .assets[].name')
          for name in "Pullover-$version.dmg" "Pullover-$version.zip" latest-mac.yml; do
            grep -qx "$name" <<<"$assets" || { echo "::error::The draft is missing $name — not publishing it."; exit 1; }
          done
          if [ -n "$previous" ]; then
            git log --no-merges --format='- %s' "$range" > notes.md
          else
            # The first release of this fork has no tag to count from, and the
            # whole upstream history is not what changed.
            printf '%s\n' '- 🧩 **Azure DevOps** — sign in with a personal access token to see your pull requests, your teams'"'"' reviews and the work items assigned to you, alongside everything Pullover already did for GitHub.' > notes.md
          fi
          gh release edit '${{ github.ref_name }}' --repo '${{ github.repository }}' \
            --title '${{ github.ref_name }}' --notes-file notes.md --draft=false

      - name: Write release notes and publish the draft
        if: steps.notes.outputs.claude == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # Prompt on stdin, not as a trailing argument: `--allowedTools` takes
          # a variadic <tools...>, so it swallowed the prompt that followed it
          # and the v0.2.0 run died with "Input must be provided either through
          # stdin or as a prompt argument". stdin sidesteps the ambiguity.
          claude -p --allowedTools 'Bash(git:*),Bash(gh:*),Write' <<'PROMPT'
          You are running inside GitHub Actions — the `publish` job of Pullover's release workflow, non-interactive, nobody to ask questions. Your only task is to finish the release for tag ${{ github.ref_name }}.

          Ignore the release playbook in AGENTS.md — it is for the local agent, and its part is already done: the version is bumped, the tag is pushed, and the build job has attached the dmg to a DRAFT GitHub release for this tag. You are the CI half. Your job:

          1. List every release for this tag: `gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | {id, draft, assets: [.assets[].name]}'`. electron-builder sometimes races itself and leaves TWO drafts for the same tag with the assets split between them. If that happened, consolidate: for each stray asset, download it (`gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/<asset-id> > <name>`) and re-upload it to the draft that holds the dmg (`curl -sS -f -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @<name> "https://uploads.github.com/repos/${{ github.repository }}/releases/<id>/assets?name=<name>"`), then delete the now-empty extra draft (`gh api -X DELETE repos/${{ github.repository }}/releases/<id>`).
          2. Verify the single remaining draft holds `Pullover-<version>.dmg` (what people download), plus `Pullover-<version>.zip`, `Pullover-<version>.zip.blockmap` and `latest-mac.yml` (what the auto-updater reads — without them installed copies will never see this release). One universal build, no arch suffix. There should be no `.dmg.blockmap`; if one appears, `dmg.writeUpdateInfo` has been turned back on and the release carries a file nothing reads. If anything is missing, print what's wrong and exit with `exit 1` — do NOT publish a broken release.
          3. Write user-facing release notes from the commits since the previous tag: find it with `git describe --tags --abbrev=0 ${{ github.ref_name }}^` (if the command fails, this is the first release — write a 2-3 sentence introduction of the app from README.md instead of a changelog). Notes style: a flat bullet list, no headings. One bullet per user-visible change, present tense, no commit hashes.

          Leave out everything nobody running the app can feel: tests and test infrastructure, CI and workflow changes, refactors, build and tooling work, dependency bumps that change no behaviour, and documentation. The question is never how much work a change was — a large, careful change to how the project tests itself still belongs nowhere near these notes — only whether it alters what someone sees or does when they open Pullover. A bug fix counts only if the bug was reachable: one in code no release shipped yet is invisible from outside.

          If nothing in the range passes that test, say so in a single line instead of reaching for the excluded work to fill the space: `- 🔧 **Maintenance release** — internal changes only, nothing new to see.` Notes that admit a release is boring cost nothing; notes that dress up a CI change as a feature teach people to stop reading them.

          Write each bullet as: an emoji, then the change named in bold, then a sentence saying what it means for the person using the app. For example: `- 🔔 **Mentions** — a pull request that mentions you now shows up even when you are not a reviewer.` Pick each emoji for that specific change rather than repeating one down the list, and use at most one per bullet. Lead with the change people will care about most.

          Two things override the cheerfulness. Anything that loses data, signs the user out, resets settings or otherwise requires action gets ⚠️ and says plainly what will happen — that bullet goes first, whatever else is in the release. And a fix is described by what stopped being broken, not by praising the fix.

          Do not invent significance. A small release stays a short list; padding two bug fixes into a triumphant announcement reads as noise, and the next release then has to shout louder to compete.
          4. Publish: write the notes to a file and run `gh release edit ${{ github.ref_name }} --title '${{ github.ref_name }}' --notes-file <file> --draft=false`. Passing `--title` is not optional: electron-builder names the draft after the version (`0.3.0`) rather than the tag (`v0.3.0`), so without it every release is titled inconsistently with the others and has to be renamed by hand.
          PROMPT

      - name: Verify the release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::The release is still a draft — Claude did not publish it. Check the step above; the artifacts are attached, so you can publish it by hand."
            exit 1
          fi
